name: Build production CSS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motornote-production-css
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile Tailwind CSS
        run: |
          mkdir -p assets
          npm install --no-save --no-package-lock tailwindcss@4 @tailwindcss/cli@4
          ./node_modules/.bin/tailwindcss -i ./tailwind.input.css -o ./assets/tailwind.css --minify
      - name: Commit generated stylesheet
        run: |
          if git diff --quiet -- assets/tailwind.css; then
            echo "Compiled stylesheet is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tailwind.css
          git commit -m "Build production Tailwind stylesheet [skip ci]"
          git push origin HEAD:main
