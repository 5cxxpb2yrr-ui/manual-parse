<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MotorNote Pro Ultimate - Commercial Fleet & Personal Garage & Service Manual Importer</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- SurrealDB Client -->
    <script src="https://cdn.jsdelivr.net/npm/surrealdb.js"></script>

    <style>
        :root { color-scheme: dark; --bg: #07101f; --panel: #101d32; --line: #263b58; --text: #e8f0ff; --muted: #9cb0ca; --blue: #38bdf8; --amber: #ffd166; }
        body { font-family: "Inter", sans-serif; background: radial-gradient(ellipse at top,#102541,var(--bg) 60%); color: var(--text); }
        .font-mono { font-family: "JetBrains Mono", monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input, select, textarea { font-size: 16px !important; }
        .glass-panel {
            background: rgba(18, 18, 24, 0.78);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
            color: #f4f4f5;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel:hover { border-color: rgba(245, 158, 11, 0.4); }
        .glass-card-subtle {
            background: rgba(24, 24, 32, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #09090b;
            font-weight: 800;
            border-radius: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 rgba(245, 158, 11, 0.35);
        }
        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(245, 158, 11, 0.5);
        }
        .kb-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #09090b;
            font-weight: 800;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }
        .drop { border: 1px dashed #47719b; border-radius: 12px; padding: 18px; text-align: center; }
        .status { color: var(--amber); min-height: 1.5em; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 9px; }
        .stat, .result { padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
        .stat strong { display: block; color: var(--amber); font-size: 1.5rem; }
        .stat span, small { color: var(--muted); }
        .results { display: grid; gap: 9px; margin-top: 12px; }
        .result h3 { margin: 4px 0; }
        mark { background: var(--amber); color: #111; }
        .file { padding: 7px 0; border-bottom: 1px solid #263b5866; overflow-wrap: anywhere; }
        .tag { font-size: .75rem; color: #a9dfff; border: 1px solid #35516e; border-radius: 99px; padding: 2px 6px; }
        @media print {
            body { background: #ffffff !important; color: #000000 !important; }
            header, nav, button, .no-print { display: none !important; }
            .glass-panel { border: 1px solid #cccccc !important; background: #ffffff !important; color: #000000 !important; box-shadow: none !important; }
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col selection:bg-amber-500 selection:text-zinc-950">
    <motor-app></motor-app>

    <!-- SurrealDB Client Adapter & Web Components Script -->
    <script>
        // --- SurrealDB Client Adapter (SurrealDBAdapter) ---
        class SurrealDBAdapter {
            constructor() {
                this.db = null;
                this.isReady = false;
            }

            async init() {
                try {
                    if (window.Surreal) {
                        this.db = new window.Surreal();
                        await this.db.connect('mem://');
                        await this.db.use({ ns: 'motornote', db: 'garage' });
                        this.isReady = true;
                        console.log("SurrealDBAdapter initialized successfully in memory mode.");
                    }
                } catch (err) {
                    console.warn("SurrealDB connection warning, falling back to IndexedDB/localStorage:", err);
                }
            }

            async select(table) {
                if (!this.isReady) return null;
                try {
                    return await this.db.select(table);
                } catch (e) {
                    console.error(`Error selecting from ${table}:`, e);
                    return null;
                }
            }

            async create(table, data) {
                if (!this.isReady) return null;
                try {
                    return await this.db.create(table, data);
                } catch (e) {
                    console.error(`Error creating in ${table}:`, e);
                    return null;
                }
            }

            async merge(id, data) {
                if (!this.isReady) return null;
                try {
                    return await this.db.merge(id, data);
                } catch (e) {
                    console.error(`Error updating record ${id}:`, e);
                    return null;
                }
            }

            async delete(id) {
                if (!this.isReady) return null;
                try {
                    return await this.db.delete(id);
                } catch (e) {
                    console.error(`Error deleting record ${id}:`, e);
                    return null;
                }
            }
        }

        window.surrealAdapter = new SurrealDBAdapter();
        window.surrealAdapter.init();

        // --- Native Web Components ---

        // 1. Root Component (<motor-app>)
        class MotorApp extends HTMLElement {
            connectedCallback() {
                this.innerHTML = `
                <div class="w-full max-w-7xl mx-auto flex-1 flex flex-col relative shadow-2xl border-x border-zinc-900/80"
                     x-data="garageApp()" x-init="initApp()"
                     @keydown.window.cmd.k.prevent="modals.smartSearch = true"
                     @keydown.window.ctrl.k.prevent="modals.smartSearch = true">
                    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-64 bg-amber-500/10 blur-[140px] pointer-events-none z-0"></div>
                    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-64 bg-emerald-500/5 blur-[140px] pointer-events-none z-0"></div>
                    
                    <motor-app-header></motor-app-header>
                    <motor-bottom-nav></motor-bottom-nav>
                    <motor-nav-menu></motor-nav-menu>
                    
                    <main class="flex-1 px-4 sm:px-6 pt-5 pb-24 z-10">
                        <motor-dashboard x-show="currentTab === 'dashboard'"></motor-dashboard>
                        <motor-analytics x-show="currentTab === 'analytics'"></motor-analytics>
                        <motor-predictive x-show="currentTab === 'predictive'"></motor-predictive>
                        <motor-maintenance x-show="currentTab === 'maintenance'"></motor-maintenance>
                        <motor-timeline x-show="currentTab === 'timeline'"></motor-timeline>
                        <motor-repairs x-show="currentTab === 'repairs'"></motor-repairs>
                        <motor-kanban x-show="currentTab === 'projects'"></motor-kanban>
                        <motor-inventory x-show="currentTab === 'inventory'"></motor-inventory>
                        <motor-receipts x-show="currentTab === 'attachments'"></motor-receipts>
                        <motor-advisor x-show="currentTab === 'advisor'"></motor-advisor>
                        <motor-reports x-show="currentTab === 'reports'"></motor-reports>
                        <motor-knowledge-base x-show="currentTab === 'kb'"></motor-knowledge-base>
                        <motor-profile x-show="currentTab === 'profile'"></motor-profile>
                        <motor-database x-show="currentTab === 'database'"></motor-database>
                        <motor-manual-importer x-show="currentTab === 'manuals'"></motor-manual-importer>
                    </main>
                    <motor-modals></motor-modals>
                </div>`;
            }
        }
        customElements.define('motor-app', MotorApp);

        // 2. App Header Component (<motor-app-header>)
        class MotorAppHeader extends HTMLElement {
            connectedCallback() {
                this.innerHTML = `
                <header class="sticky top-0 z-40 bg-zinc-950/85 backdrop-blur-xl border-b border-zinc-800/80 px-3 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between gap-2 overflow-hidden">
                    <div class="flex items-center space-x-2 sm:space-x-4 min-w-0 flex-1">
                        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 flex items-center justify-center font-black text-zinc-950 shadow-lg shadow-amber-500/25 shrink-0 border border-amber-400/30 cursor-pointer" @click="currentTab = 'dashboard'">
                            <span x-text="activeVehicle.name.includes('Scion') ? 'xB' : 'SUB'"></span>
                        </div>
                        <div class="flex flex-col min-w-0 flex-1">
                            <div class="flex items-center space-x-2 min-w-0">
                                <select x-model="activeVehicleId" @change="switchVehicle(activeVehicleId)" class="appearance-none bg-zinc-900/90 border border-zinc-700/80 hover:border-amber-500/50 text-zinc-100 text-xs font-bold rounded-lg px-2 py-1 pr-6 focus:outline-none focus:border-amber-500 cursor-pointer transition shadow-inner truncate max-w-[130px] sm:max-w-none">
                                    <template x-for="v in vehicles" :key="v.id">
                                        <option :value="v.id" x-text="v.name"></option>
                                    </template>
                                </select>
                                <span class="hidden sm:inline-block px-2 py-0.5 rounded text-[10px] font-mono font-bold shrink-0" :class="dynamicHealth.overallHealth >= 80 ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/15 text-amber-400 border border-amber-500/30'" x-text="'Health: ' + dynamicHealth.overallHealth + '/100'"></span>
                            </div>
                            <span class="text-[11px] text-amber-400 font-medium mt-0.5 tracking-tight flex items-center space-x-1 truncate">
                                <span x-text="activeVehicle.odometer.toLocaleString() + ' mi'" class="shrink-0"></span>
                                <span>•</span>
                                <span x-text="activeVehicle.engine" class="truncate"></span>
                            </span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                        <button @click="modals.smartSearch = true" class="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-zinc-900/90 border border-zinc-700/80 hover:border-amber-500/50 text-zinc-300 text-xs font-semibold flex items-center space-x-2 transition shadow-inner active:scale-95" title="Smart Garage Search (⌘K)">
                            <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <span class="hidden md:inline">Search...</span>
                            <kbd class="hidden md:inline px-1.5 py-0.5 text-[10px] bg-zinc-800 text-zinc-400 rounded font-mono">⌘K</kbd>
                        </button>
                        <button @click="currentTab = 'advisor'" class="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-purple-500/10 border border-purple-500/30 text-purple-300 hover:bg-purple-500/20 text-xs font-bold transition flex items-center space-x-1.5 active:scale-95">
                            <span class="text-sm">🤖</span><span class="hidden sm:inline">AI Advisor</span>
                        </button>
                        <button @click="modals.importExport = true" class="p-2 rounded-xl bg-zinc-900/80 border border-zinc-800 text-zinc-300 hover:text-white transition active:scale-95" title="Backup & Export">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        </button>
                        <button @click="openNewRepairModal()" class="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 text-zinc-950 text-xs font-black hover:brightness-110 transition shadow-lg shadow-amber-500/25 active:scale-95 border border-amber-400/40 flex items-center space-x-1 shrink-0">
                            <span class="text-base font-bold leading-none">+</span>
                            <span class="hidden sm:inline">Log Service</span>
                        </button>
                    </div>
                </header>`;
            }
        }
        customElements.define('motor-app-header', MotorAppHeader);

        // 3. Navigation Component (<motor-bottom-nav>)
        class MotorBottomNav extends HTMLElement {
            connectedCallback() {
                this.innerHTML = `
                <nav class="fixed bottom-0 left-0 right-0 z-50 bg-zinc-950/95 backdrop-blur-xl border-t border-zinc-800/80 flex items-stretch" style="padding-bottom: env(safe-area-inset-bottom)">
                    <template x-for="tab in primaryNavTabs" :key="'primary-'+tab.id">
                        <button @click="currentTab = tab.id" class="flex-1 flex flex-col items-center justify-center gap-0.5 py-2 min-h-[56px] transition active:scale-95" :class="currentTab === tab.id ? 'text-amber-400' : 'text-zinc-500'">
                            <span class="text-lg leading-none" x-text="tab.icon"></span>
                            <span class="text-[10px] font-bold leading-none" x-text="tab.label"></span>
                        </button>
                    </template>
                    <button @click="modals.navMenu = true" class="flex-1 flex flex-col items-center justify-center gap-0.5 py-2 min-h-[56px] transition active:scale-95" :class="moreTabActive ? 'text-amber-400' : 'text-zinc-500'">
                        <span class="text-lg leading-none">☰</span>
                        <span class="text-[10px] font-bold leading-none">More</span>
                    </button>
                </nav>`;
            }
        }
        customElements.define('motor-bottom-nav', MotorBottomNav);

        // 4. More Nav Sheet (<motor-nav-menu>)
        class MotorNavMenu extends HTMLElement {
            connectedCallback() {
                this.innerHTML = `
                <div>
                    <div x-show="modals.navMenu" x-transition.opacity class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm" style="display: none;" @click="modals.navMenu = false"></div>
                    <div x-show="modals.navMenu" x-transition class="fixed bottom-0 left-0 right-0 z-50 bg-zinc-900 border-t border-amber-500/30 rounded-t-2xl shadow-2xl max-h-[75vh] overflow-y-auto no-scrollbar" style="display: none; padding-bottom: env(safe-area-inset-bottom);">
                        <div class="sticky top-0 bg-zinc-900 flex justify-between items-center px-4 pt-4 pb-3 border-b border-zinc-800/80">
                            <span class="text-[10px] font-black uppercase text-amber-400 tracking-wider">More Destinations</span>
                            <button @click="modals.navMenu = false" class="text-zinc-500 hover:text-white p-2.5 -m-1 rounded-lg leading-none">✕</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 p-4">
                            <template x-for="tab in moreNavTabs" :key="'more-'+tab.id">
                                <button @click="currentTab = tab.id; modals.navMenu = false" class="text-left px-3 py-3 rounded-xl text-xs font-bold transition flex items-center space-x-2.5" :class="currentTab === tab.id ? 'bg-amber-500 text-zinc-950 shadow-md shadow-amber-500/20' : 'bg-zinc-950/60 text-zinc-300 hover:bg-zinc-800/70'">
                                    <span class="text-base" x-text="tab.icon"></span>
                                    <span x-text="tab.label"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>`;
            }
        }
        customElements.define('motor-nav-menu', MotorNavMenu);

        // 5. Service Manual Importer & Parser Component (<motor-manual-importer>)
        class MotorManualImporter extends HTMLElement {
            connectedCallback() {
                this.innerHTML = `
                <div class="space-y-6">
                    <div class="eyebrow text-amber-400 uppercase tracking-widest text-xs font-bold">Offline-First Knowledge Builder</div>
                    <h1 class="text-2xl sm:text-3xl font-black text-white">Service Manual & ZIP Importer</h1>
                    <p class="text-xs text-zinc-400">Import a ZIP archive containing factory service manuals (HTML, PDF, TXT, XML, MD). JSZip parses, strips third-party boilerplate/navigation clutter, resolves absolute/relative links to IndexedDB document keys, and indexes procedures, specs, and Diagnostic Trouble Codes (DTCs) instantly.</p>

                    <section class="panel glass-panel p-5 space-y-4">
                        <h2 class="text-sm font-bold text-white uppercase tracking-wider">1 · Import Archive</h2>
                        <div class="drop border-2 border-dashed border-amber-500/30 rounded-2xl p-6 text-center bg-zinc-950/60 relative hover:border-amber-500/55 transition">
                            <input id="manualZipInput" type="file" accept=".zip,application/zip" @change="importManualZip($event.target.files[0])" class="absolute inset-0 opacity-0 cursor-pointer" />
                            <div class="space-y-2 pointer-events-none">
                                <div class="text-3xl">📦</div>
                                <div class="text-sm font-bold text-white">Drop or Select Service Manual .ZIP File</div>
                                <div class="text-[11px] text-zinc-400">ZIP archives stay entirely in browser storage. Supported: HTML/HTM, XML, TXT/MD/CSV, PDF text.</div>
                            </div>
                        </div>
                        <div id="status" class="status text-xs font-mono" x-text="manualImportStatus"></div>
                        <div class="stats grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <div class="stat bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                                <span class="text-lg font-black text-amber-400 font-mono" x-text="Object.keys(manualWorkbench.pages).length">0</span>
                                <span class="text-[10px] text-zinc-400 uppercase">Indexed Pages</span>
                            </div>
                            <div class="stat bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                                <span class="text-lg font-black text-emerald-400 font-mono" x-text="Object.keys(manualWorkbench.dtcs).length">0</span>
                                <span class="text-[10px] text-zinc-400 uppercase">Recognized DTCs</span>
                            </div>
                            <div class="stat bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                                <span class="text-lg font-black text-purple-400 font-mono" x-text="manualWorkbench.importedAt ? 'Loaded' : 'Ready'">Ready</span>
                                <span class="text-[10px] text-zinc-400 uppercase">Storage Status</span>
                            </div>
                            <div class="stat bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                                <span class="text-lg font-black text-blue-400 font-mono">IndexedDB</span>
                                <span class="text-[10px] text-zinc-400 uppercase">Storage Engine</span>
                            </div>
                        </div>
                    </section>

                    <section class="panel glass-panel p-5 space-y-4">
                        <h2 class="text-sm font-bold text-white uppercase tracking-wider">2 · Search Indexed Manuals & DTCs</h2>
                        <input id="searchManualsInput" type="search" x-model="manualSearchQuery" @keyup.enter="searchManuals()" placeholder="Search procedure, symptom, spec, part number, or DTC (e.g. P0300)…" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-amber-500 font-semibold" />
                        
                        <div class="text-xs text-zinc-400" x-show="manualWorkbench.searchResults.length">
                            Showing <strong class="text-white" x-text="manualWorkbench.searchResults.length"></strong> matching procedure(s)
                        </div>

                        <div x-show="!manualWorkbench.selectedPage" class="space-y-2 max-h-[500px] overflow-y-auto no-scrollbar">
                            <template x-for="page in manualWorkbench.searchResults" :key="page.id">
                                <button class="glass-panel p-3.5 w-full text-left hover:border-amber-500/50 transition flex justify-between items-start gap-3" @click="openManualPage(page.id)">
                                    <div>
                                        <div class="font-bold text-sm text-white" x-text="page.title"></div>
                                        <nav class="text-[11px] text-zinc-400 mt-0.5 truncate flex flex-wrap items-center gap-1" aria-label="Breadcrumb">
                                            <template x-for="(crumb, idx) in (page.breadcrumbs || [])" :key="idx">
                                                <span class="inline-flex items-center">
                                                    <a href="#" @click.prevent.stop="openManualPage(crumb.id)" class="hover:text-amber-400 underline decoration-amber-500/30" x-text="crumb.label"></a>
                                                    <span x-show="idx < (page.breadcrumbs.length - 1)" class="mx-1 text-zinc-600">›</span>
                                                </span>
                                            </template>
                                        </nav>
                                        <div x-show="page.dtcs && page.dtcs.length" class="text-[11px] text-amber-400 font-mono mt-1">
                                            DTCs: <span x-text="page.dtcs.join(', ')"></span>
                                        </div>
                                    </div>
                                    <span class="text-amber-400 font-bold text-xs shrink-0">View →</span>
                                </button>
                            </template>
                            <div x-show="!manualWorkbench.searchResults.length" class="p-6 text-center text-xs text-zinc-500">
                                No manual documents indexed yet. Import a ZIP archive above to begin searching.
                            </div>
                        </div>

                        <div x-show="manualWorkbench.selectedPage" class="bg-zinc-950 p-5 rounded-xl border border-zinc-800 space-y-4">
                            <button class="px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-bold text-zinc-300 hover:text-white" @click="manualWorkbench.selectedPage = null">← Back to Index</button>
                            <h2 class="text-lg font-black text-white" x-text="manualWorkbench.selectedPage?.title"></h2>
                            
                            <!-- Dynamic IndexedDB Relative Breadcrumb Navigation -->
                            <nav class="text-xs text-amber-400 font-mono flex flex-wrap items-center gap-1 py-1 px-3 bg-zinc-900/80 rounded-lg border border-zinc-800" aria-label="Breadcrumb navigation">

                                    <span class="inline-flex items-center">
                                        <a href="#" @click.prevent="openManualPage(crumb.id)" class="hover:underline font-bold text-amber-400" x-text="crumb.label"></a>

                                    </span>
                                </template>
                            </nav>

                            <article class="prose prose-invert max-w-none text-zinc-300 text-xs sm:text-sm leading-relaxed border-t border-zinc-800 pt-4" @click="handleArticleClick($event)">
                                <div x-html="manualWorkbench.selectedPage?.cleanHtml"></div>
                            </article>
                        </div>

                        <details class="text-xs text-zinc-400 pt-2">
                            <summary class="cursor-pointer font-bold text-amber-400">View Archive Inventory List</summary>
                            <div class="mt-2 space-y-1 max-h-40 overflow-y-auto font-mono text-[11px] bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                                <template x-for="(page, path) in manualWorkbench.pages" :key="path">
                                    <div class="file py-1 border-b border-zinc-900 flex justify-between items-center">
                                        <a href="#" @click.prevent="openManualPage(path)" class="text-zinc-300 hover:text-amber-400 truncate" x-text="path"></a>
                                        <span class="text-amber-400 ml-2 text-[10px]" x-text="page.dtcs?.length ? page.dtcs.join(', ') : 'Spec'"></span>
                                    </div>
                                </template>
                            </div>
                        </details>

        // --- Alpine Application Logic ---
        function garageApp() {
            return {
                currentTab: "manuals",
                activeVehicleId: "scion-xb",
                manualSearchQuery: "",
                manualImportStatus: "",
                manualExportStatus: "",
                vehicles: [
                    { id: "scion-xb", name: "2006 Scion xB", odometer: 212000, engine: "1.5L 1NZ-FE I4" },
                    { id: "subaru-crosstrek", name: "2019 Subaru Crosstrek", odometer: 68450, engine: "2.0L FB20D H4" }
                ],
                primaryNavTabs: [
                    { id: "dashboard", label: "Dashboard", icon: "📊" },
                    { id: "timeline", label: "Timeline", icon: "⏳" },
                    { id: "repairs", label: "Repairs", icon: "🛠️" },
                    { id: "manuals", label: "Manuals", icon: "📖" }
                ],
                navTabs: [
                    { id: "dashboard", label: "Dashboard", icon: "📊" },
                    { id: "analytics", label: "Analytics", icon: "📈" },
                    { id: "predictive", label: "Predictive", icon: "🔮" },
                    { id: "maintenance", label: "Maintenance", icon: "🔧" },
                    { id: "timeline", label: "Timeline", icon: "⏳" },
                    { id: "repairs", label: "Repairs", icon: "🛠️" },
                    { id: "projects", label: "Kanban", icon: "📋" },
                    { id: "inventory", label: "Inventory", icon: "📦" },
                    { id: "attachments", label: "Receipts", icon: "📎" },
                    { id: "advisor", label: "AI Advisor", icon: "🤖" },
                    { id: "reports", label: "Reports", icon: "📑" },
                    { id: "kb", label: "Knowledge Base", icon: "📚" },
                    { id: "profile", label: "Specs", icon: "🚘" },
                    { id: "database", label: "Database", icon: "🛡️" },
                    { id: "manuals", label: "Manuals", icon: "📖" }
                ],
                get primaryNavTabsList() {
                    return this.navTabs.slice(0, 4);
                },
                get moreNavTabs() {
                    return this.navTabs.slice(4);
                },
                get moreTabActive() {
                    return !this.primaryNavTabs.map(t => t.id).includes(this.currentTab);
                },
                manualWorkbench: {
                    loaded: false,
                    importedAt: null,
                    pages: {},
                    dtcs: {},
                    selectedPage: null,
                    searchResults: []
                },
                modals: { smartSearch: false, navMenu: false, importExport: false },

                get activeVehicle() {
                    return this.vehicles.find(v => v.id === this.activeVehicleId) || this.vehicles[0];
                },
                get dynamicHealth() {
                    return { overallHealth: 92 };
                },
                switchVehicle(id) { this.activeVehicleId = id; },
                
                async initApp() {
                    console.log("MotorNote Pro Ultimate initialized with Web Components & SurrealDBAdapter.");
                    if (window.surrealAdapter && window.surrealAdapter.isReady) {
                        try {
                            const records = await window.surrealAdapter.select('kb_manuals');
                            if (records && Array.isArray(records) && records.length > 0) {
                                records.forEach(r => {
                                    if (r.id) {
                                        this.manualWorkbench.pages[r.id] = r;
                                        (r.dtcs || []).forEach(code => {
                                            if (!this.manualWorkbench.dtcs[code]) this.manualWorkbench.dtcs[code] = [];
                                            this.manualWorkbench.dtcs[code].push(r);
                                        });
                                    }
                                });
                                this.searchManuals();
                                this.manualImportStatus = `Loaded ${records.length} manual document(s) from IndexedDB storage.`;
                            }
                        } catch (e) {
                            console.warn("Could not load from SurrealDB:", e);
                        }
                    }
                },

                // Helper to resolve relative ZIP paths to canonical IndexedDB document keys
                resolveIndexedDBPath(basePath, relativeHref) {
                    if (!relativeHref || relativeHref.startsWith('http://') || relativeHref.startsWith('https://') || relativeHref.startsWith('javascript:') || relativeHref.startsWith('#')) {
                        return relativeHref;
                    }
                    // Clean query string or hash for key matching
                    const cleanHref = relativeHref.split('?')[0].split('#')[0];
                    const baseParts = basePath.split('/');
                    baseParts.pop(); // Remove current filename

                    const hrefParts = cleanHref.split('/');
                    for (const part of hrefParts) {
                        if (part === '.') continue;
                        if (part === '..') {
                            if (baseParts.length > 0) baseParts.pop();
                        } else {
                            baseParts.push(part);
                        }
                    }
                    return baseParts.join('/');
                },

                async importManualZip(file) {
                    if (!file) return;
                    this.manualImportStatus = "Extracting and parsing ZIP archive with JSZip...";
                    try {
                        const zip = await JSZip.loadAsync(file);
                        const pages = {};
                        const dtcs = {};

                        for (const path in zip.files) {
                            if (!path.endsWith(".html") && !path.endsWith(".htm") && !path.endsWith(".txt") && !path.endsWith(".xml") && !path.endsWith(".md")) continue;
                            const content = await zip.files[path].async("text");
                            
                            let page;
                            if (path.endsWith(".html") || path.endsWith(".htm") || path.endsWith(".xml")) {
                                const parser = new DOMParser();
                                const doc = parser.parseFromString(content, "text/html");
                                
                                // Strip third-party mirror branding, themes & boilerplate
                                this.filterBoilerplate(doc);

                                const rawText = doc.body?.innerText || "";
                                page = {
                                    id: path, // Key stored in IndexedDB / SurrealDB
                                    title: (doc.title || path).replace(/\s+—\s+.*?Service Manual.*$/i, "").trim(),
                                    text: rawText,
                                    cleanHtml: this.cleanManualHTML(doc, path),
                                    dtcs: this.extractDTCs(rawText),
                                    breadcrumbs: this.extractBreadcrumbs(doc, path)
                                };
                            } else {
                                page = {
                                    id: path,
                                    title: path.split('/').pop() || path,
                                    text: content,
                                    cleanHtml: `<pre class="whitespace-pre-wrap font-mono text-xs">${content}</pre>`,
                                    dtcs: this.extractDTCs(content),
                                    breadcrumbs: this.extractBreadcrumbsFromPath(path)
                                };
                            }

                            pages[path] = page;
                            page.dtcs.forEach(code => {
                                if (!dtcs[code]) dtcs[code] = [];
                                dtcs[code].push(page);
                            });

                            if (window.surrealAdapter && window.surrealAdapter.isReady) {
                                await window.surrealAdapter.create('kb_manuals', page);
                            }
                        }

                        this.manualWorkbench.pages = pages;
                        this.manualWorkbench.dtcs = dtcs;
                        this.manualWorkbench.loaded = true;
                        this.manualWorkbench.importedAt = new Date().toISOString();
                        this.searchManuals();

                        this.manualImportStatus = `Successfully parsed and indexed ${Object.keys(pages).length} manual document(s) and ${Object.keys(dtcs).length} unique DTC(s).`;
                    } catch (err) {
                        console.error("ZIP import error:", err);
                        this.manualImportStatus = "Error parsing ZIP file: " + err.message;
                    }
                },

                filterBoilerplate(doc) {
                    if (!doc || !doc.body) return;

                    const selectorsToRemove = [
                        'header', 'footer', 'nav', '.navigation', '.breadcrumb', '.breadcrumbs',
                        'a[href*="Dogeware"]', 'div:has(> a[href*="Dogeware"])'
                    ];

                    selectorsToRemove.forEach(selector => {
                        try {
                            doc.querySelectorAll(selector).forEach(el => el.remove());
                        } catch (e) {}
                    });

                    const elements = doc.body.querySelectorAll('*');
                    elements.forEach(el => {
                        if (el.children.length === 0 && el.textContent) {
                            let text = el.textContent;
                            if (
                                text.includes("Dogeware Lemon Mirror") ||
                                text.includes("CHARM + LEMON Car Manuals") ||
                                text.includes("Do you like it dark?") ||
                                text.includes("Easier on the eyes.") ||
                                text.includes("Such Wow! Many Redundancy!") ||
                                (text.includes("Home") && text.includes(">>") && text.includes("Scion"))
                            ) {
                                el.remove();
                            }
                        }
                    });
                },

                extractDTCs(text) {
                    return [...new Set(text.match(/[PCBU]\d{4}(?:\/\d+)?/g) || [])];
                },

                // Extract breadcrumb links and resolve their href relative to IndexedDB key storage
                extractBreadcrumbs(doc, currentPath) {
                    const links = [...doc.querySelectorAll("a")];
                    const crumbs = [];

                    links.forEach(a => {
                        const label = (a.textContent || "").trim();
                        const rawHref = a.getAttribute("href");
                        if (!label || label === "Home" || label.includes("Dogeware") || label.includes("Lemon")) return;

                        let targetId = currentPath;
                        if (rawHref) {
                            targetId = this.resolveIndexedDBPath(currentPath, rawHref);
                        }

                        crumbs.push({ label, id: targetId });
                    });

                    return crumbs.length ? crumbs.slice(0, 8) : this.extractBreadcrumbsFromPath(currentPath);
                },

                extractBreadcrumbsFromPath(path) {
                    const parts = path.split('/');
                    const crumbs = [];
                    let current = '';
                    parts.forEach((p, idx) => {
                        current = current ? `${current}/${p}` : p;
                        crumbs.push({
                            label: p.replace(/\.(html|htm|txt|md|xml)$/i, '').replace(/[-_]/g, ' '),
                            id: current
                        });
                    });
                    return crumbs;
                },

                // Rewrites anchor hrefs in HTML body to target IndexedDB document keys directly
                cleanManualHTML(doc, currentPath) {
                    const clone = doc.cloneNode(true);
                    clone.querySelectorAll("script, style, iframe").forEach(el => el.remove());
                    
                    clone.querySelectorAll("a").forEach(a => {
                        const href = a.getAttribute("href");
                        if (href && !href.startsWith("http://") && !href.startsWith("https://") && !href.startsWith("#")) {
                            const resolvedId = this.resolveIndexedDBPath(currentPath, href);
                            a.setAttribute("data-idb-key", resolvedId);
                            a.setAttribute("href", "#");
                            a.classList.add("text-amber-400", "underline", "hover:text-amber-300", "cursor-pointer");
                        }
                    });

                    return clone.body ? clone.body.innerHTML : "";
                },

                openManualPage(pageId) {
                    if (!pageId) return;
                    // Exact match or fallback partial match in IndexedDB page key dictionary
                    let targetPage = this.manualWorkbench.pages[pageId];
                    if (!targetPage) {
                        const keys = Object.keys(this.manualWorkbench.pages);
                        const matchedKey = keys.find(k => k === pageId || k.endsWith(pageId) || pageId.endsWith(k));
                        if (matchedKey) targetPage = this.manualWorkbench.pages[matchedKey];
                    }

                    if (targetPage) {
                        this.manualWorkbench.selectedPage = targetPage;
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        console.warn(`Manual document key [${pageId}] not found in IndexedDB index.`);
                    }
                },

                handleArticleClick(event) {
                    const link = event.target.closest("a[data-idb-key]");
                    if (link) {
                        event.preventDefault();
                        const key = link.getAttribute("data-idb-key");
                        this.openManualPage(key);
                    }
                },

                searchManuals() {
                    const q = (this.manualSearchQuery || "").toLowerCase().trim();
                    if (!q) {
                        this.manualWorkbench.searchResults = Object.values(this.manualWorkbench.pages).slice(0, 50);
                        return;
                    }
                    const score = (page) => {
                        let s = 0;
                        if (page.title.toLowerCase().includes(q)) s += 100;
                        if (page.dtcs.some(d => d.toLowerCase().includes(q))) s += 80;
                        if (page.text.toLowerCase().includes(q)) s += 10;
                        return s;
                    };

                    this.manualWorkbench.searchResults = Object.values(this.manualWorkbench.pages)
                        .filter(p => score(p) > 0)
                        .sort((a, b) => score(b) - score(a))
                        .slice(0, 100);
                },

                exportManualViewer() {
                    const data = JSON.stringify(this.manualWorkbench.pages);
                    const scriptContent = `// MotorNote Pro Service Manual Viewer Runtime
const manualData = ${data};
console.log("Loaded manual viewer with " + Object.keys(manualData).length + " pages.");`;
                    const blob = new Blob([scriptContent], { type: "application/javascript" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "service-manual-viewer.js";
                    a.click();
                    this.manualExportStatus = "Exported service-manual-viewer.js successfully.";
                },

                exportManualJson() {
                    const data = JSON.stringify(this.manualWorkbench, null, 2);
                    const blob = new Blob([data], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "manual-data.json";
                    a.click();
                    this.manualExportStatus = "Exported manual-data.json successfully.";
                },

                openNewRepairModal() {
                    alert("Service Log Intake Wizard initialized.");
                }
            };
        }
